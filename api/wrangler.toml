name = "vim-jp-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "vim-jp-profile-stats-dev"
database_id = "local"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:5173"

[dev]
port = 3000
