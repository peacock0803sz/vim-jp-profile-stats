version: 2

updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router"
          - "@tanstack/*"
      dev-tools:
        patterns:
          - "typescript"
          - "vite"
          - "vitest"
          - "oxlint"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: ":arrow_up:"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ":arrow_up:"
    groups:
      actions:
        patterns:
          - "*"

  # Terraform providers
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    labels:
      - dependencies
      - terraform
    commit-message:
      prefix: ":arrow_up:"
