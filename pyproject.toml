[project]
name = "vim-jp-profile-stats"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gspread>=6.1.2",
  "plotly>=6.9.0",
  "streamlit>=1.61.1",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
